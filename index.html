<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">CLAUDE TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd>/<kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <div id="records" class="records hidden">
            <form id="record-form" class="record-form hidden">
              <label for="record-name">¡Entras al top 5! Tu nombre:</label>
              <div class="record-form-row">
                <input id="record-name" type="text" maxlength="12" autocomplete="off" placeholder="Nombre" />
                <button type="submit" id="record-save-btn">Guardar</button>
              </div>
            </form>
            <div id="records-table" class="records-table"></div>
            <p id="records-stats" class="records-stats"></p>
            <button type="button" id="reset-records-btn" class="link-btn">Resetear records</button>
          </div>
          <button id="restart-btn">Reiniciar</button>
        </div>
      </div>

      <div id="pause-menu" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Menú de pausa">
        <div class="overlay-box pause-box">
          <p class="pause-title">PAUSA</p>
          <button id="resume-btn" class="menu-btn">Reanudar</button>
          <button id="pause-restart-btn" class="menu-btn">Reiniciar</button>
          <button id="controls-btn" class="menu-btn" aria-expanded="false" aria-controls="pause-controls">Ver controles</button>
          <ul id="pause-controls" class="hidden">
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> / <kbd>X</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
          <div id="level-picker" class="menu-btn level-picker" tabindex="0" role="spinbutton" aria-label="Nivel inicial" aria-valuemin="1" aria-valuemax="15">
            <span title="Se aplica al reiniciar">Nivel inicial</span>
            <span class="level-ctl">
              <button type="button" id="level-dec" tabindex="-1" aria-label="Bajar nivel">&minus;</button>
              <b id="start-level-value">1</b>
              <button type="button" id="level-inc" tabindex="-1" aria-label="Subir nivel">+</button>
            </span>
          </div>
          <p class="menu-hint">El nivel inicial se aplica al pulsar Reiniciar</p>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
